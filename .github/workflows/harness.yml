name: Harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # The harness links only the engine-independent sources, so no game assemblies are needed.
      # The mod project is not built here, because it references sts2.dll from the game install.
      - name: Build the harness
        run: dotnet build tests/RegressionHarness/WaitIHaveVuln.RegressionHarness.csproj

      - name: Run the harness
        run: dotnet run --no-build --project tests/RegressionHarness/WaitIHaveVuln.RegressionHarness.csproj
